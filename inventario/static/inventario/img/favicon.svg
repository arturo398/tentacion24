<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <defs>
        <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#ff1a1a"/>
            <stop offset="45%" stop-color="#ff6600"/>
            <stop offset="80%" stop-color="#ffb700"/>
            <stop offset="100%" stop-color="#fffb00"/>
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    <!-- Dark Circular Background for high contrast in browser tabs -->
    <rect width="64" height="64" rx="16" fill="#111319"/>
    <circle cx="32" cy="32" r="27" fill="#181a22" stroke="url(#flameGrad)" stroke-width="2"/>
    <!-- Stylized Flame Body -->
    <path d="M32 9 C32 9 20 22 20 35 C20 44 25.5 50 32 50 C38.5 50 44 44 44 35 C44 26 36 21 36 21 C36 21 38 27 35 30 C32 33 29 27 32 9 Z" fill="url(#flameGrad)" filter="url(#glow)"/>
    <!-- Inner Flame Core -->
    <path d="M32 23 C32 23 25 31 25 38 C25 43 28 46 32 46 C36 46 39 43 39 38 C39 32 34 29 34 29 C34 29 35 33 33 35 C31 37 30 32 32 23 Z" fill="#ffffff" opacity="0.95"/>
</svg>
